name: CI

on:
  # Protected main requires this PR check on an up-to-date base. Reuse it after
  # merge instead of running the same tree again on push or every night.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  UV_LINK_MODE: hardlink

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_heavy: ${{ steps.filter.outputs.run_heavy }}
    steps:
      - name: Detect runtime-affecting changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/$PR_NUMBER/files" \
            --jq '.[].filename') || {
              echo "Failed to retrieve pull request changed files" >&2
              exit 1
            }

          run_heavy=false
          if [ -n "$changed_files" ]; then
            while IFS= read -r path; do
              case "$path" in
                *.md|docs/*) ;;
                *) run_heavy=true; break ;;
              esac
            done <<< "$changed_files"
          fi
          echo "run_heavy=$run_heavy" >> "$GITHUB_OUTPUT"

  quality:
    needs: changes
    if: needs.changes.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: just

      - name: Install dependencies
        run: uv sync --locked

      - name: Static quality gate
        run: just check

  coverage-shard:
    needs: changes
    if: needs.changes.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.15.2"
      UV_PYTHON_DOWNLOADS: "never"
    # Two file shards use the same Python, not a Python version matrix.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"

      - name: Filesystem diagnostics
        run: python3 scripts/ci_pytest_runner.py diagnose

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: just

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify selected interpreter
        run: uv run python -c 'import os, sys; expected = tuple(map(int, os.environ["UV_PYTHON"].split("."))); actual = sys.version_info[:len(expected)]; print(sys.version); assert actual == expected, f"expected {expected}, got {actual}"'

      - name: Test one half with coverage
        run: python3 scripts/ci_pytest_runner.py run -- just coverage-shard "${{ matrix.shard }}" --durations=20

      - name: Upload raw coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.shard }}
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  crap-threshold:
    needs: [changes, coverage-shard]
    if: needs.changes.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage-parts
      - name: Combine coverage and enforce CRAP threshold
        run: |
          test -f coverage-parts/coverage-0/.coverage
          test -f coverage-parts/coverage-1/.coverage
          uv run python -c 'from coverage import CoverageData; from pathlib import Path; paths = [Path("coverage-parts") / f"coverage-{i}" / ".coverage" for i in (0, 1)]; data = [CoverageData(basename=str(p)) for p in paths]; [d.read() for d in data]; assert all(d.has_arcs() and d.measured_files() for d in data), "invalid or empty branch coverage artifact"'
          uv run coverage combine coverage-parts/coverage-0/.coverage coverage-parts/coverage-1/.coverage
          uv run coverage json -o coverage.json
          uv run python -m devtools.crap_threshold --coverage coverage.json --src src/mcp_telegram

  docker-build:
    needs: changes
    if: needs.changes.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: just

      - name: Production Docker image build
        run: just docker-build-check

  ci:
    if: always()
    runs-on: ubuntu-latest
    needs: [changes, quality, coverage-shard, crap-threshold, docker-build]
    steps:
      - name: Check required jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN_HEAVY: ${{ needs.changes.outputs.run_heavy }}
          QUALITY: ${{ needs.quality.result }}
          SHARDS: ${{ needs.coverage-shard.result }}
          COVERAGE: ${{ needs.crap-threshold.result }}
          DOCKER: ${{ needs.docker-build.result }}
        run: |
          test "$CHANGES" = success
          if [ "$RUN_HEAVY" = true ]; then
            test "$QUALITY" = success && test "$SHARDS" = success && \
              test "$COVERAGE" = success && test "$DOCKER" = success
          else
            test "$RUN_HEAVY" = false && test "$QUALITY" = skipped && \
              test "$SHARDS" = skipped && test "$COVERAGE" = skipped && test "$DOCKER" = skipped
          fi
