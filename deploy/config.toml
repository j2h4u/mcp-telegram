[state]
dir = "/srv/mcp-telegram/database"

[freshness.reactions]
# Re-fetch reaction counts after this local snapshot expires.
freshness_ttl_seconds = 600

[freshness.read_receipts]
# Refresh Telegram read-at facts after ten minutes.
read_at_ttl_seconds = 600

[freshness.inbox]
# Keep messages deleted before they were read visible in the inbox for one day.
deleted_message_visibility_seconds = 86400

[freshness.entities]
# Entity details and resolver enrichment are short-lived; directory snapshots last longer.
detail_ttl_seconds = 300
user_directory_ttl_seconds = 2592000
group_directory_ttl_seconds = 604800
resolver_enrichment_ttl_seconds = 300

[entity_profile]
# Wait briefly for a full profile, then fall back to the available progressive projection.
# Paired users.GetFullUser acquisition is enabled by default.
# Set false for rollback on a release that understands the additive v62 schema.
full_user_pair_enabled = true
foreground_resolve_seconds = 3.0
foreground_refresh_wait_seconds = 15.0
rpc_timeout_seconds = 8.0
refresh_timeout_seconds = 25.0
max_concurrent_refreshes = 1
max_queued_refreshes = 128

[telemetry]
# Retain local tool telemetry for 30 days. This never sends telemetry remotely.
retention_ttl_seconds = 2592000

[telemetry.runtime_observations]
# Keep scheduler telemetry best-effort and bounded under SQLite contention.
prune_every_writes = 1000
writer_busy_timeout_ms = 50
queue_capacity = 1024
writer_startup_wait_seconds = 1.0
shutdown_drain_grace_seconds = 2.0
# Five-minute per-source summaries keep the 30-day window within this cap.
rpc_summary_interval_seconds = 300
row_cap = 250000

[telegram_rpc]
# One account-wide limiter shared by every service class.
max_calls_per_period = 30
period_seconds = 60
transient_retry_delays_seconds = [0]

[telegram_rpc.scheduler]
# Weighted FIFO admission with separately reserved queue capacity and deadlines.
interactive_weight = 6
live_sync_weight = 3
background_weight = 1
interactive_queue_capacity = 64
live_sync_queue_capacity = 256
background_queue_capacity = 512
interactive_deadline_seconds = 15
live_sync_deadline_seconds = 60
background_deadline_seconds = 900
# Stable product-level retry guidance when local admission is temporarily full.
admission_retry_seconds = 1
update_loop_retry_seconds = 5

[scheduling]
# Local daemon maintenance intervals. Compose environment variables can override these.
scheduled_reconciliation_seconds = 900
# Refresh the cached account display identity without delaying MCP sessions.
self_profile_refresh_seconds = 86400
read_position_reconciliation_seconds = 900
read_position_reconciliation_max_dialogs_per_pass = 100
read_position_reconciliation_failure_cooldown_seconds = 3600
read_position_reconciliation_batch_size = 15
read_position_reconciliation_batch_pause_seconds = 1.5
reconciliation_hourly_seconds = 3600
# Maximum wait for one Telegram activity RPC before the worker abandons it.
activity_rpc_timeout_seconds = 120
activity_cold_backfill_seconds = 300
activity_cold_backfill_batch_pause_seconds = 5
activity_cold_enroll_seconds = 1800
activity_cold_access_retry_seconds = 3600

[scheduling.activity_hot_sweep]
loop_interval_seconds = 3600
max_peers_per_pass = 16
base_due_seconds = 3600
max_due_seconds = 604800
jitter_max_seconds = 300
initial_spread_seconds = 86400

[scheduling.fact_hydration]
# Bounded lazy re-fetch of media metadata for legacy `other/{}` rows.
interval_seconds = 300
max_requests_per_cycle = 4
max_jobs_per_cycle = 300
batch_size = 100
pause_between_requests_seconds = 5
retry_delay_seconds = 21600
circuit_retry_seconds = 1800
max_attempts = 3
backfill_debt_limit = 1

[scheduling.folder_projection]
# Folder membership acquisition runs in the daemon and never from read requests.
refresh_interval_seconds = 900
jitter_ratio = 0.10
retry_delays_seconds = [60, 120, 240, 480]
retry_cap_seconds = 900
warning_failure_threshold = 3
# Omit stale_after_seconds to derive it from refresh interval plus retry cap.

[http]
# Safe local defaults; Docker Compose overrides the bind host and port for its internal endpoint.
host = "127.0.0.1"
port = 3100

[logging]
# Process log level; LOG_LEVEL in the environment overrides this deployment default.
level = "INFO"
