# Module boundaries, enforced by Tach (https://github.com/tach-org/tach).
#
# THIS FILE DECLARES THE IDEAL ARCHITECTURE, NOT TODAY'S REALITY.
# `just module-boundaries` is expected to be red while the modular-monolith
# cleanup is in progress. Failures are architecture debt, not edges to
# normalize into the graph.

source_roots = ["src"]
root_module = "forbid"
exact = false
layers_explicit_depends_on = true
forbid_circular_dependencies = true
ignore_type_checking_imports = false

# Highest first. Higher layers may depend downward only through explicitly
# declared edges. Same-layer edges are also explicit. Upward edges are wrong.
layers = [
    "delivery",          # CLI/MCP/server transports and agent-facing tools
    "composition",       # process roots; the only layer that wires concretes
    "application",       # use cases, read facades, background orchestration
    "capability",        # vertical product/domain behavior
    "telegram_gateway",  # Telethon anti-corruption adapters and live fact I/O
    "persistence",       # SQLite schema, repositories, local read models
    "foundation",        # pure contracts, config, formatting, errors, utilities
]

[rules]
unused_ignore_directives = "warn"
require_ignore_directive_reasons = "error"

# ---------------------------------------------------------------------------
# delivery — presentation/transports. No TelegramClient and no SQLite.
# ---------------------------------------------------------------------------

[[modules]]
path = "mcp_telegram.server"
layer = "delivery"
depends_on = [
    "mcp_telegram.tools",
    "mcp_telegram.correlation",
]

[[modules]]
path = "mcp_telegram.tools"
layer = "delivery"
depends_on = [
    "mcp_telegram.daemon_client",
    "mcp_telegram.daemon_ipc",
    "mcp_telegram.models",
    "mcp_telegram.resolver",
    "mcp_telegram.formatter",
    "mcp_telegram.pagination",
    "mcp_telegram.budget",
    "mcp_telegram.errors",
    "mcp_telegram.temporal",
    "mcp_telegram.correlation",
]
cannot_depend_on = [
    "mcp_telegram.daemon",
    "mcp_telegram.daemon_api",
    "mcp_telegram.telegram",
    "mcp_telegram.sync_db",
    "mcp_telegram.messages.telegram_adapter",
    "mcp_telegram.messages.sqlite_repository",
    "mcp_telegram.folders.telegram_adapter",
    "mcp_telegram.folders.sqlite_repository",
    "mcp_telegram.reactions.telegram_adapter",
    "mcp_telegram.reactions.sqlite_repository",
    "mcp_telegram.topics.telegram_adapter",
    "mcp_telegram.topics.sqlite_repository",
]

[[modules]]
path = "mcp_telegram"
layer = "delivery"
depends_on = [
