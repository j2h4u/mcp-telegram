# Enforced module boundaries for the brownfield modular monolith.
#
# This is a green current-state ratchet, not an aspirational graph.  Every
# dependency is explicit; temporary exceptions are named `deprecated` edges
# with a removal condition in docs/architecture-cleanup.md.

source_roots = ["src"]
root_module = "forbid"
exact = true
layers_explicit_depends_on = true
forbid_circular_dependencies = true
ignore_type_checking_imports = false

layers = [
    "delivery",
    "composition",
    "application",
    "capability",
    "telegram_gateway",
    "persistence",
    "foundation",
]

[rules]
unused_ignore_directives = "warn"
require_ignore_directive_reasons = "error"

# delivery — inbound transports only.
[[modules]]
path = "mcp_telegram"
layer = "delivery"
depends_on = ["mcp_telegram.config", "mcp_telegram.daemon", "mcp_telegram.daemon_client", "mcp_telegram.feedback_db", "mcp_telegram.server", "mcp_telegram.telegram"]

[[modules]]
path = "mcp_telegram.server"
layer = "delivery"
depends_on = ["mcp_telegram.config", "mcp_telegram.correlation", "mcp_telegram.daemon_client", "mcp_telegram.tools"]

[[modules]]
path = "mcp_telegram.tools"
layer = "delivery"
depends_on = ["mcp_telegram.daemon_client", "mcp_telegram.entity_identity", "mcp_telegram.errors", "mcp_telegram.formatter", "mcp_telegram.message_content", "mcp_telegram.models", "mcp_telegram.pagination", "mcp_telegram.resolver", "mcp_telegram.temporal", "mcp_telegram.topic_identity"]
cannot_depend_on = [
    "mcp_telegram.daemon", "mcp_telegram.daemon_api", "mcp_telegram.feedback_db",
    "mcp_telegram.folders.sqlite_repository", "mcp_telegram.folders.telegram_adapter",
    "mcp_telegram.messages.sqlite_repository", "mcp_telegram.messages.telegram_adapter",
    "mcp_telegram.reactions.sqlite_repository", "mcp_telegram.reactions.telegram_adapter",
    "mcp_telegram.sync_db", "mcp_telegram.telegram",
    "mcp_telegram.topics.sqlite_repository", "mcp_telegram.topics.telegram_adapter",
]

